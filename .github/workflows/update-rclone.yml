name: Update rclone

on:
  schedule:
    - cron: 0 0 * * 0
  workflow_dispatch:

concurrency:
  group: update-rclone
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: Update rclone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get latest rclone version
        id: version
        run: |
          latest_version="$(curl -fsSL https://downloads.rclone.org/version.txt | sed 's/^rclone v//' | xargs)"
          current_version="$(awk -F'= *' '/^RCLONE_VERSION \?=/{print $2}' Makefile | xargs)"
          : "${latest_version:?Could not parse latest rclone version from version.txt}"
          : "${current_version:?Could not read pinned rclone version from Makefile}"

          echo "Latest rclone version: ${latest_version}"
          echo "Current rclone version: ${current_version}"

          echo "latest=${latest_version}" >> "$GITHUB_OUTPUT"
          echo "current=${current_version}" >> "$GITHUB_OUTPUT"

      - name: Update Makefile
        if: steps.version.outputs.latest != steps.version.outputs.current
        run: |
          sed -i -E "s/^RCLONE_VERSION \?= .*/RCLONE_VERSION ?= ${{ steps.version.outputs.latest }}/" Makefile

      - name: Commit and create pull request
        if: steps.version.outputs.latest != steps.version.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_name="update-rclone"

          gh pr list --head "${branch_name}" --state open --json number --jq '.[].number' | while read -r pr; do
            [[ -n "${pr}" ]] && gh pr close "${pr}" --delete-branch
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "${branch_name}"
          git add Makefile

          git commit -m "Update rclone to ${{ steps.version.outputs.latest }}"
          git push --force --set-upstream origin "${branch_name}"

          release_url="https://github.com/rclone/rclone/releases/tag/v${{ steps.version.outputs.latest }}"
          release_notes="$(gh api "repos/rclone/rclone/releases/tags/v${{ steps.version.outputs.latest }}" --jq '.body' 2>/dev/null || true)"

          {
            echo "Updates rclone from ${{ steps.version.outputs.current }} to ${{ steps.version.outputs.latest }}."
            echo
            echo "Release: ${release_url}"
            if [[ -n "${release_notes}" ]]; then
              echo
              echo "## Release notes"
              echo
              echo "${release_notes}"
            fi
          } > pr_body.md

          gh pr create \
            --head "${branch_name}" \
            --base "${{ github.ref_name }}" \
            --title "Update rclone to ${{ steps.version.outputs.latest }}" \
            --body-file pr_body.md
